name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-lint-test:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Backend
        run: npm run typecheck:backend --if-present

      - name: Lint Backend
        run: npm run lint:backend --if-present

      - name: Run Backend Unit Tests
        run: npm run test:backend --if-present
        env:
          NODE_ENV: test
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_ANON_KEY: mock-anon-key
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          FLAG_SECRET_SALT: mock-flag-secret-salt-for-testing-purposes-32-chars

  frontend-lint-test:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Frontend
        run: npm run typecheck:frontend --if-present

      - name: Lint Frontend
        run: npm run lint:frontend --if-present

      - name: Build Frontend
        run: npm run build:frontend --if-present
        env:
          VITE_API_URL: /api/v1
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key
          VITE_APP_NAME: "Cyber Crew CTF"

  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for committed secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Run npm audit
        run: npm audit --audit-level=high || true
